[package]
name = "streammoe-chat"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT AND LicenseRef-PolyForm-Noncommercial-1.0.0"
description = "Local chat page for trying a streammoe model under a memory cap"

[dependencies]
streammoe = { path = "../../crates/streammoe", features = ["model-qwen3-6-35b-a3b"] }
serde_json = "1"
libc = "0.2"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Standalone: not a workspace member, so the engine crate gains no
# dependencies from this tool.
[workspace]

[profile.release]
debug = false
